// Generic exporter: builds a real HTML table (not delimited text) so Excel always
// splits it into proper columns/rows regardless of the system locale's list separator.
// Also auto-sizes columns, formats numbers, zebra-stripes rows and appends a totals row.
function downloadExcelTable(filename, title, headers, rows, opts) {
  opts = opts || {};
  const isAr = state.lang === "ar";
  const esc = (v) => String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const isNum = (v) => typeof v === "number" && !Number.isNaN(v);

  const BORDER = "#D8CFA0";
  const HEAD_BG = "#3F4A20";
  const HEAD_FG = "#FFFFFF";
  const STRIPE_BG = "#F8F5E4";
  const TOTAL_BG = "#EFE8C4";

  // Auto column widths from header + cell content lengths (characters -> px).
  const colWidths = headers.map((h, i) => {
    const lens = [String(h).length, ...rows.map(r => String(r[i] == null ? "" : r[i]).length)];
    const maxLen = Math.max(0, ...lens);
    return Math.min(320, Math.max(70, maxLen * 7 + 24));
  });

  // Which columns are fully numeric (used for right-align + totals row).
  const numericCols = headers.map((_, i) => rows.length > 0 && rows.every(r => r[i] == null || r[i] === "" || isNum(r[i])));

  const colsHtml = colWidths.map(w => `<col style="width:${w}px">`).join("");

  const titleHtml = title ? `
    <tr><td colspan="${headers.length}" style="background:${HEAD_BG};color:${HEAD_FG};font:bold 15px sans-serif;padding:8px 6px;border:1px solid ${HEAD_BG};">${esc(title)}</td></tr>
    <tr><td colspan="${headers.length}" style="font:11px sans-serif;color:#666;padding:2px 6px;border:none;">${esc(opts.subtitle || (t("reports.generatedAt") + ": " + new Date().toLocaleString()))}</td></tr>
    <tr><td colspan="${headers.length}" style="border:none;line-height:6px;">&nbsp;</td></tr>` : "";

  const headHtml = `<tr>${headers.map((h, i) => `
    <th style="background:${HEAD_BG};color:${HEAD_FG};font:bold 12px sans-serif;padding:6px;border:1px solid ${HEAD_BG};text-align:${numericCols[i] ? "right" : (isAr ? "right" : "left")};white-space:nowrap;">${esc(h)}</th>`).join("")}</tr>`;

  let bodyHtml = "";
  rows.forEach((r, rowIdx) => {
    const bg = rowIdx % 2 === 0 ? "#FFFFFF" : STRIPE_BG;
    bodyHtml += `<tr>${r.map((c, i) => {
      const num = isNum(c);
      const align = numericCols[i] ? "right" : (isAr ? "right" : "left");
      const fmtAttr = num ? ` x:num="${c}" style="background:${bg};font:12px sans-serif;padding:5px 6px;border:1px solid ${BORDER};text-align:${align};mso-number-format:'#,##0.00';"` : ` style="background:${bg};font:12px sans-serif;padding:5px 6px;border:1px solid ${BORDER};text-align:${align};"`;
      return `<td${fmtAttr}>${num ? c.toFixed(2) : esc(c)}</td>`;
    }).join("")}</tr>`;
  });

  let totalsHtml = "";
  if (rows.length > 0 && numericCols.some(Boolean)) {
    const labelColIdx = numericCols.findIndex(v => !v);
    totalsHtml = `<tr>${headers.map((_, i) => {
      if (numericCols[i]) {
        const sum = rows.reduce((s, r) => s + (isNum(r[i]) ? r[i] : 0), 0);
        return `<td x:num="${sum}" style="background:${TOTAL_BG};font:bold 12px sans-serif;padding:6px;border:1px solid ${BORDER};text-align:right;mso-number-format:'#,##0.00';">${sum.toFixed(2)}</td>`;
      }
      if (i === (labelColIdx === -1 ? 0 : labelColIdx)) {
        return `<td style="background:${TOTAL_BG};font:bold 12px sans-serif;padding:6px;border:1px solid ${BORDER};text-align:${isAr ? "right" : "left"};">${esc(t("reports.total"))}</td>`;
      }
      return `<td style="background:${TOTAL_BG};border:1px solid ${BORDER};"></td>`;
    }).join("")}</tr>`;
  }

  const noDataHtml = rows.length === 0 ? `<tr><td colspan="${headers.length}" style="padding:14px;border:1px solid ${BORDER};text-align:center;color:#888;font:12px sans-serif;">${esc(t("reports.noData"))}</td></tr>` : "";

  const freezePane = `<!--[if gte mso 9]><xml>
    <x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
      <x:Name>Sheet1</x:Name>
      <x:WorksheetOptions>
        <x:FreezePanes/><x:FrozenNoSplit/>
        <x:SplitHorizontal>${title ? 4 : 1}</x:SplitHorizontal>
        <x:TopRowBottomPane>${title ? 4 : 1}</x:TopRowBottomPane>
        <x:ActivePane>2</x:ActivePane>
      </x:WorksheetOptions>
    </x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook>
  </xml><![endif]-->`;

  const doc = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8">${freezePane}</head>
    <body dir="${isAr ? "rtl" : "ltr"}">
      <table dir="${isAr ? "rtl" : "ltr"}" style="border-collapse:collapse;">
        <colgroup>${colsHtml}</colgroup>
        ${titleHtml}
        ${headHtml}
        ${noDataHtml}
        ${bodyHtml}
        ${totalsHtml}
      </table>
    </body></html>`;

  try {
    const blob = new Blob(["\ufeff" + doc], { type: "application/vnd.ms-excel;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch {
    const win = window.open();
    if (win) win.document.write(doc);
    else alert(filename);
  }
}

const reportsTypeLabel = (type) => t("pos." + { DINE_IN: "dineIn", TAKEAWAY: "takeaway", DELIVERY: "delivery", VILLA_SERVICE: "villaService" }[type]);
const reportsPaymentLabel = (pm) => pm === "CASH" ? t("pos.cash") : pm === "CARD" ? t("pos.card") : pm === "FOLIO" ? t("villas.folio") : (pm || "");
const reportsReferenceLabel = (order) => {
  if (order.type === "DINE_IN" && order.tableNumber) return `${t("pos.table")} ${order.tableNumber}`;
  if (order.type === "VILLA_SERVICE" && order.villaStayId) {
    const stay = state.villaStays.find(s => s.id === order.villaStayId);
    const villa = stay ? state.villas.find(v => v.id === stay.villaId) : null;
    if (villa) return `${state.lang === "ar" ? villa.nameAr : villa.nameEn}${stay.guestName ? " — " + stay.guestName : ""}`;
  }
  return "—";
};

// Shared calculations — used by both the on-screen report and its matching export,
// so the numbers you see are always exactly what gets exported.
function computeRevenueByType(orders) {
  const byType = {};
  for (const o of orders) byType[o.type] = (byType[o.type] || 0) + o.total;
  return byType;
}
function computeTopProducts(orders, limit) {
  const productTotals = {};
  for (const o of orders) {
    for (const it of o.items) productTotals[it.productId] = (productTotals[it.productId] || 0) + it.qty * it.price;
  }
  return Object.entries(productTotals)
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit || 6)
    .map(([productId, revenue]) => ({ product: state.products.find(p => p.id === productId), revenue }));
}
function computeExpensesByCategory(expenses) {
  const byCategory = {};
  for (const e of expenses) byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
  return byCategory;
}
function computeOutstandingBalances() {
  return state.villaStays.filter(s => !s.checkOut).map(s => ({
    stay: s, villa: state.villas.find(v => v.id === s.villaId), balance: FolioService.totals(s.id).balance,
    daysOpen: Math.max(0, Math.floor((Date.now() - new Date(s.checkIn).getTime()) / 86400000)),
  })).filter(x => x.balance > 0).sort((a, b) => b.balance - a.balance);
}
// Past guests: every stay that has already checked out, with its final folio numbers.
// Filtered by checkOut date against the reports date range so it behaves like the other reports.
function computeStaysHistory(from, to) {
  return state.villaStays
    .filter(s => s.checkOut && inRange(s.checkOut, from, to))
    .map(s => {
      const villa = state.villas.find(v => v.id === s.villaId);
      const totals = FolioService.totals(s.id);
      const nights = Math.max(1, Math.round((new Date(s.checkOut) - new Date(s.checkIn)) / 86400000));
      return { stay: s, villa, totals, nights };
    })
    .sort((a, b) => new Date(b.stay.checkOut) - new Date(a.stay.checkOut));
}
function reportsOrdersInRange() {
  const { from, to } = getReportsBounds();
  return state.orders.filter(o => inRange(o.createdAt, from, to));
}
function reportsExpensesInRange() {
  const { from, to } = getReportsBounds();
  return reportsExpensesFor(from, to);
}

/* ---------------- Reports: per-tab data builders ---------------- */

function reportsBuildTabData(tabKey) {
  switch (tabKey) {
    case "revenueByType": {
      const byType = computeRevenueByType(reportsOrdersInRange());
      const rows = Object.entries(byType).sort((a, b) => b[1] - a[1]).map(([type, val]) => [reportsTypeLabel(type), val]);
      return { title: t("reports.revenueByType"), headers: [t("reports.type"), t("reports.revenue")], rows };
    }
    case "topProducts": {
      const topProducts = computeTopProducts(reportsOrdersInRange(), 500);
      const rows = topProducts.map(tp => [tp.product ? (state.lang === "ar" ? tp.product.nameAr : tp.product.nameEn) : "—", tp.revenue]);
      return { title: t("reports.topProducts"), headers: [t("reports.product"), t("reports.revenue")], rows };
    }
    case "expensesByCategory": {
      const byCategory = computeExpensesByCategory(reportsExpensesInRange());
      const rows = Object.entries(byCategory).sort((a, b) => b[1] - a[1]).map(([cat, val]) => [t("accounting.categories." + cat), val]);
      return { title: t("reports.expensesByCategory"), headers: [t("accounting.category"), t("accounting.amount")], rows };
    }
    case "outstandingBalances": {
      const outstanding = computeOutstandingBalances();
      const rows = outstanding.map(x => [`${state.lang === "ar" ? x.villa.nameAr : x.villa.nameEn} — ${x.stay.guestName}`, x.daysOpen, x.balance]);
      return { title: t("reports.outstandingBalances"), headers: [t("reports.guest"), t("reports.daysOpen"), t("reports.balance")], rows };
    }
    case "staysHistory": {
      const { from, to } = getReportsBounds();
      const history = computeStaysHistory(from, to);
      const rows = history.map(x => [
        state.lang === "ar" ? x.villa?.nameAr : x.villa?.nameEn,
        x.stay.guestName,
        x.stay.phone || "—",
        new Date(x.stay.checkIn).toLocaleDateString(),
        new Date(x.stay.checkOut).toLocaleDateString(),
        x.nights,
        x.totals.charges,
        x.totals.payments,
        x.totals.balance,
      ]);
      return {
        title: t("reports.staysHistory"),
        headers: [t("villas.title"), t("reports.guest"), t("villas.phone"), t("reports.checkIn"), t("reports.checkOut"), t("reports.nights"), t("reports.total"), t("reports.paid"), t("reports.balance")],
        rows,
        rowIds: history.map(x => x.stay.id), // lets renderReportsDetailPage make each row open its closed folio
      };
    }
    case "ordersReport": {
      const orders = reportsOrdersInRange().slice().reverse();
      const rows = orders.map(o => [o.number, reportsTypeLabel(o.type), reportsReferenceLabel(o), reportsPaymentLabel(o.paymentMethod), o.subtotal ?? "", o.tax ?? "", o.total, new Date(o.createdAt).toLocaleString()]);
      return { title: t("reports.ordersReport"), headers: [t("reports.orderNo"), t("reports.type"), t("reports.reference"), t("pos.paymentMethod"), t("pos.subtotal"), t("pos.vat"), t("reports.total"), t("reports.time")], rows };
    }
    case "purchasesReport": {
      const { from, to } = getReportsBounds();
      const purchases = state.stockMovements
        .filter(mv => mv.type === "IN")
        .filter(mv => inRange(mv.purchaseDate || mv.createdAt, from, to))
        .sort((a, b) => new Date(b.purchaseDate || b.createdAt) - new Date(a.purchaseDate || a.createdAt));
      const rows = purchases.map(mv => {
        const item = state.inventoryItems.find(i => i.id === mv.itemId);
        const itemName = item ? (state.lang === "ar" ? item.nameAr : item.nameEn) : "—";
        // Use the EGP figure actually paid at purchase time (stored on the movement),
        // not the item's current unitCost — that can have since been overwritten by a
        // later, differently-priced purchase.
        const lineTotalEgp = mv.lineTotalEGP != null ? mv.lineTotalEGP : (item ? Math.round(mv.qty * usdToEgp(item.unitCost || 0) * 100) / 100 : 0);
        return [
          new Date(mv.purchaseDate || mv.createdAt).toLocaleDateString(),
          itemName,
          mv.qty,
          item ? item.unit : "",
          mv.supplier || "—",
          mv.invoiceNumber || "—",
          lineTotalEgp,
        ];
      });
      return { title: t("reports.purchasesReport"), headers: [t("reports.time"), t("inventory.item"), t("inventory.qty"), t("inventory.unit"), t("inventory.supplier"), t("inventory.invoiceNumber"), `${t("accounting.amount")} (${t("common.egp")})`], rows };
    }
    default:
      return { title: "", headers: [], rows: [] };
  }
}

function renderReportsDetailPage(tabDef) {
  const { title, headers, rows, rowIds } = reportsBuildTabData(tabDef.key);
  // Filter rows and rowIds in lockstep so a clickable row still opens the
  // right stay's folio after a search narrows the list.
  const q = reportsSearch.trim().toLowerCase();
  const keepIdx = !q ? rows.map((_, i) => i) : rows.map((_, i) => i).filter(i => rows[i].some(c => String(c).toLowerCase().includes(q)));
  const filteredRows = keepIdx.map(i => rows[i]);
  const filteredIds = rowIds ? keepIdx.map(i => rowIds[i]) : null;
  reportsActiveTitle = title;
  reportsActiveHeaders = headers;
  reportsActiveRows = filteredRows;

  const numericCols = headers.map((_, i) => rows.length > 0 && rows.every(r => r[i] == null || r[i] === "" || typeof r[i] === "number"));

  return `
    ${renderReportsDetailHeader(tabDef, filteredRows.length, true)}

}

function renderReportsOverviewDetail() {
  const { from, to } = getReportsBounds();
  const { from: pFrom, to: pTo } = getReportsPreviousBounds(from, to);

  const current = reportsRevenueFor(from, to);
  const previous = pFrom ? reportsRevenueFor(pFrom, pTo) : null;
  const currentExpenses = reportsExpensesFor(from, to);
  const previousExpenses = pFrom ? reportsExpensesFor(pFrom, pTo) : null;

  const totalExpenses = currentExpenses.reduce((s, e) => s + e.amount, 0);
  const prevTotalExpenses = previousExpenses ? previousExpenses.reduce((s, e) => s + e.amount, 0) : 0;
  const netProfit = current.revenue - totalExpenses;
  const prevNetProfit = previous ? previous.revenue - prevTotalExpenses : 0;
  const ordersCount = current.orders.length;
  const prevOrdersCount = previous ? previous.orders.length : 0;
  const avgOrderValue = ordersCount > 0 ? current.orders.reduce((s, o) => s + o.total, 0) / ordersCount : 0;
  const prevAvgOrderValue = prevOrdersCount > 0 ? previous.orders.reduce((s, o) => s + o.total, 0) / prevOrdersCount : 0;
  const occupancy = computeOccupancyRate(from, to);
  const prevOccupancy = pFrom ? computeOccupancyRate(pFrom, pTo) : null;

  reportsActiveTitle = t("reports.overview");
  reportsActiveHeaders = [t("reports.metric"), t("reports.value")];
  reportsActiveRows = [
    [t("reports.revenue"), current.revenue],
    [t("reports.orders"), ordersCount],
    [t("reports.avgOrderValue"), avgOrderValue],
    [t("reports.expenses"), totalExpenses],
    [t("reports.netProfit"), netProfit],
    [t("reports.occupancy"), occupancy === null ? 0 : occupancy],
  ];

  return `
    ${renderReportsDetailHeader(REPORTS_TABS[0], 6, false)}
    <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3">
      ${kpiCard(t("reports.revenue"), current.revenue, { accent: "text-green-600", icon: "💰", delta: previous ? deltaPct(current.revenue, previous.revenue) : null })}
      ${kpiCard(t("reports.orders"), ordersCount, { suffix: "", icon: "🧾", delta: previous ? deltaPct(ordersCount, prevOrdersCount) : null })}
      ${kpiCard(t("reports.avgOrderValue"), avgOrderValue, { icon: "📊", delta: previous ? deltaPct(avgOrderValue, prevAvgOrderValue) : null })}
      ${kpiCard(t("reports.expenses"), totalExpenses, { accent: "text-red-600", icon: "💸", delta: previous ? deltaPct(totalExpenses, prevTotalExpenses) : null })}
      ${kpiCard(t("reports.netProfit"), netProfit, { accent: netProfit >= 0 ? "text-green-600" : "text-red-600", icon: netProfit >= 0 ? "📈" : "📉", delta: previous ? deltaPct(netProfit, prevNetProfit) : null })}
      ${kpiCard(t("reports.occupancy"), occupancy === null ? "—" : occupancy.toFixed(1), { suffix: occupancy === null ? "" : "%", icon: "🏨", delta: (prevOccupancy !== null && prevOccupancy !== undefined) ? deltaPct(occupancy, prevOccupancy) : null })}
    </div>`;
}

function renderReports() {
  if (!reportsTab) return renderReportsGrid();
  if (reportsTab === "overview") return renderReportsOverviewDetail();
  const tabDef = REPORTS_TABS.find(tb => tb.key === reportsTab);
  return renderReportsDetailPage(tabDef);
}

   ============================================================ */

function render() {
  if (!currentUser) {
    document.getElementById("app").innerHTML = renderLogin();
    return;
  }
  // Defense in depth: even if currentRoute was left pointing at a page this
  // user can no longer reach (e.g. an admin just revoked it, or it's the
  // admin-only Settings page), fall back to the first page they can open.
  if (!canAccess(currentUser, currentRoute)) {
    currentRoute = accessibleNavKeys(currentUser)[0] || "dashboard";
  }
  applyTheme();
  let page;
  switch (currentRoute) {
    case "dashboard": page = renderDashboard(); break;
    case "villas": page = renderVillas(); break;
    case "pos": page = renderPOS(); break;
    case "tours": page = renderTours(); break;
    case "inventory": page = renderInventory(); break;
    case "accounting": page = renderAccounting(); break;
    case "reports": page = renderReports(); break;
    case "settings": page = renderSettings(); break;
    default: page = renderDashboard();
  }
  document.getElementById("app").innerHTML = layout(page);
  updateSyncBadge();
}

function bootApp() {
  const sessionUserId = loadSessionUserId();
  if (sessionUserId) {
    const user = state.users.find((u) => u.id === sessionUserId);
    if (user) currentUser = user;
    else clearSession(); // stale session pointing at a since-deleted user
  }
  syncStatus = isRemoteConfigured() ? "idle" : "off";
  render();
  if (isRemoteConfigured()) {
    pullRemoteState({ silent: true }); // catch up on anything saved elsewhere since our last visit
    startRemotePolling();
  }
}

bootApp();

// ---- PWA: manifest + icons are REAL files (manifest.json, icon-192.png, icon-512.png)
// linked from <head>. A blob:-generated manifest is NOT accepted by Chrome for install —
// the phone then only creates a browser shortcut instead of a real app.

// ---- PWA: service worker registration (enables install + offline shell caching) ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>

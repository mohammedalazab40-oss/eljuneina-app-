<script>
/* ============================================================
   Eljuneina Villas — Restaurant + Tourism + Villas ERP
   Single-file working web app (client-side, localStorage-backed)
   ============================================================ */

const STORAGE_KEY = "eljuneina_erp_v1";
const SESSION_KEY = "eljuneina_erp_session_v1";

function simpleHash(str) {
  // Legacy, non-cryptographic hash. Kept only so previously-saved browsers (and the
  // seeded demo admin account) can still log in once — see AuthService.login, which
  // transparently upgrades any account still using this to real PBKDF2 below.
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(16);
}

/* ---------------- Real password hashing (Web Crypto PBKDF2) ----------------
   There is still no backend/database server — everything lives in the browser's
   localStorage — but passwords are now protected with a real, salted, iterated
   cryptographic hash (PBKDF2-SHA256) instead of the old reversible-looking custom
   hash above, so a leaked backup file/localStorage dump can't be trivially reversed
   or rainbow-tabled. */
const CRYPTO_AVAILABLE = !!(window.crypto && window.crypto.subtle);
const PBKDF2_ITERATIONS = 150000;

function bytesToHex(bytes) {
  return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}
async function pbkdf2Hash(password, saltBytes, iterations) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: saltBytes, iterations, hash: "SHA-256" }, keyMaterial, 256);
  return bytesToHex(new Uint8Array(bits));
}
// Stored format: pbkdf2$<iterations>$<saltHex>$<hashHex>
async function hashPasswordSecure(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const hash = await pbkdf2Hash(password, salt, PBKDF2_ITERATIONS);
  return `pbkdf2$${PBKDF2_ITERATIONS}$${bytesToHex(salt)}$${hash}`;
}
async function verifyPasswordSecure(password, stored) {
  const parts = (stored || "").split("$");
  if (parts.length !== 4 || parts[0] !== "pbkdf2") return false;
  const iterations = Number(parts[1]);
  const salt = hexToBytes(parts[2]);
  const expectedHash = parts[3];
  const hash = await pbkdf2Hash(password || "", salt, iterations);
  return hash === expectedHash;
}
async function hashPassword(password) {
  return CRYPTO_AVAILABLE ? hashPasswordSecure(password) : simpleHash(password);
}

/* ---------------- Login lockout (brute-force throttling) ----------------
   Purely client-side, so it won't stop someone editing localStorage directly, but it
   does stop casual repeated password guessing through the login form itself. */
const LOCKOUT_KEY = "eljuneina_login_lockout_v1";
function loadLockouts() {
  try { return JSON.parse(safeStorageGet(localStorage, LOCKOUT_KEY) || "{}"); } catch { return {}; }
}
function saveLockouts(data) { safeStorageSet(localStorage, LOCKOUT_KEY, JSON.stringify(data)); }
function lockoutKey(username) { return (username || "").trim().toLowerCase(); }
function getLockoutInfo(username) {
  return loadLockouts()[lockoutKey(username)] || { attempts: 0, lockUntil: 0 };
}
function isLockedOut(username) {
  return getLockoutInfo(username).lockUntil > Date.now();
}
function lockoutSecondsLeft(username) {
  return Math.max(0, Math.ceil((getLockoutInfo(username).lockUntil - Date.now()) / 1000));
}
function recordFailedAttempt(username) {
  const key = lockoutKey(username);
  if (!key) return;
  const data = loadLockouts();
  const info = data[key] || { attempts: 0, lockUntil: 0 };
  info.attempts += 1;
  if (info.attempts >= 5) {
    // Progressive lockout: 30s at the 5th failure, +30s per failure after that, capped at 5 minutes.
    const extraFailures = Math.min(info.attempts - 5, 9);
    info.lockUntil = Date.now() + (30 + extraFailures * 30) * 1000;
  }
  data[key] = info;
  saveLockouts(data);
}
function clearLockout(username) {
  const key = lockoutKey(username);
  const data = loadLockouts();
  delete data[key];
  saveLockouts(data);
}

function clone(obj) {
  return typeof structuredClone === "function" ? structuredClone(obj) : JSON.parse(JSON.stringify(obj));
}

// Older saves (from before role-based access existed) have users with no
// role/permissions field. Those accounts keep full ("admin") access on
// upgrade rather than being silently locked out — an admin can then use
// Settings > Users to demote/restrict them as needed.
function normalizeUsers(s) {
  if (s && Array.isArray(s.users)) {
    s.users = s.users.map((u) => ({
      ...u,
      role: u.role === "staff" || u.role === "admin" ? u.role : "admin",
      permissions: Array.isArray(u.permissions) ? u.permissions : [],
      canEditClosedFolios: u.canEditClosedFolios === true,
    }));
  }
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return clone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    // shallow-merge so new default fields (future phases) don't break existing saves
    const merged = { ...clone(DEFAULT_STATE), ...parsed };
    normalizeUsers(merged);
    // The saved menu (categories/products/inventory/tours/currency) predates the
    // current menu — replace it with the fresh defaults instead of keeping the
    // stale, previously-saved arrays.
    if (parsed.menuVersion !== MENU_VERSION) {
      merged.categories = clone(DEFAULT_STATE.categories);
      merged.products = clone(DEFAULT_STATE.products);
      merged.inventoryItems = clone(DEFAULT_STATE.inventoryItems);
      merged.tours = clone(DEFAULT_STATE.tours);
      merged.currency = DEFAULT_STATE.currency;
      merged.usdRate = DEFAULT_STATE.usdRate;
      merged.menuVersion = MENU_VERSION;
    }
    return merged;
  } catch {
    return clone(DEFAULT_STATE);
  }
}

// Storage can throw in some contexts (sandboxed previews, private browsing, strict
// browser settings) — every write goes through this so a blocked storage API degrades
// to "works for this session, just doesn't persist" instead of silently halting the
// click that triggered it.
function safeStorageSet(storage, key, value) {
  try { storage.setItem(key, value); return true; } catch { return false; }
}
function safeStorageGet(storage, key) {
  try { return storage.getItem(key); } catch { return null; }
}
function safeStorageRemove(storage, key) {
  try { storage.removeItem(key); } catch { /* ignore */ }
}

function saveState() {
  safeStorageSet(localStorage, STORAGE_KEY, JSON.stringify(state));
  scheduleRemoteSync();
}

/* ============================================================
   GOOGLE SHEETS SYNC (optional — app works purely offline/local if not configured)
   ------------------------------------------------------------
   The Apps Script Web App (see Code.gs) exposes the whole ERP as a single JSON
   state, backed by real per-table sheets in a Google Sheet. This makes multiple
   people/devices share ONE dataset instead of each having their own separate
   localStorage copy.

   Trade-off to know: every save pushes the *entire* state (like a bigger, shared
   localStorage), not per-row edits. A revision counter + Apps Script's LockService
   stop two simultaneous saves from silently corrupting each other, but if someone
   else saved first, our push is rejected as a CONFLICT — we then pull their latest
   copy and ask the user to redo whatever they were doing. It's good enough for a
   handful of staff on the same small ERP; it isn't a true real-time multi-user
   database.
   ============================================================ */

const REMOTE_CONFIG_KEY = "eljuneina_remote_config_v1"; // { url, token }
const REMOTE_REVISION_KEY = "eljuneina_remote_revision_v1";
const REMOTE_PULL_INTERVAL_MS = 20000;

function loadRemoteConfig() {
  try { return JSON.parse(safeStorageGet(localStorage, REMOTE_CONFIG_KEY) || "null"); } catch { return null; }
}
function saveRemoteConfig(cfg) { safeStorageSet(localStorage, REMOTE_CONFIG_KEY, JSON.stringify(cfg)); }
function clearRemoteConfig() { safeStorageRemove(localStorage, REMOTE_CONFIG_KEY); }
function isRemoteConfigured() {
  const cfg = loadRemoteConfig();
  return !!(cfg && cfg.url);
}
function getLastSyncedRevision() { return Number(safeStorageGet(localStorage, REMOTE_REVISION_KEY) || 0); }
function setLastSyncedRevision(rev) { safeStorageSet(localStorage, REMOTE_REVISION_KEY, String(rev)); }

// idle | syncing | synced | conflict | offline | error | off
let syncStatus = "off";
let remoteSyncTimer = null;
let remotePushInFlight = false;
let remotePushQueued = false;
let remotePollTimer = null;

// ---- Safety net: keep a copy of THIS device's data before a remote copy replaces it ----
// (rescue.html can download these; nothing is ever lost silently.)
const LOCAL_BACKUP_PREFIX = "eljuneina_local_backup_";
const LOCAL_BACKUP_KEEP = 2;
function backupLocalStateBeforeReplace_(reason) {
  try {
    const current = safeStorageGet(localStorage, STORAGE_KEY);
    if (!current) return;
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(LOCAL_BACKUP_PREFIX) === 0) keys.push(k);
    }
    keys.sort();
    // identical to the newest backup? nothing new to keep
    if (keys.length && safeStorageGet(localStorage, keys[keys.length - 1]) === current) return;
    while (keys.length >= LOCAL_BACKUP_KEEP) safeStorageRemove(localStorage, keys.shift());
    const key = LOCAL_BACKUP_PREFIX + new Date().toISOString().replace(/[:.]/g, "-") + "_" + (reason || "pull");
    if (!safeStorageSet(localStorage, key, current)) {
      // storage full: drop older backups and retry once
      keys.forEach((k) => safeStorageRemove(localStorage, k));
      safeStorageSet(localStorage, key, current);
    }
  } catch (e) { /* never block sync because of a backup problem */ }
}

// Reads the Apps Script Web App with fetch() and NO cookies (credentials: "omit").
// Why: a <script>/JSONP load sends the browser's Google cookies, and when the browser
// is signed in to more than one Google account, Google answers with an HTML
// "unable to open the file" page instead of our data — the app then shows Offline.
// An anonymous fetch() has no such problem and works on every device. JSONP is kept
// only as a fallback (e.g. the page opened from file://).
async function remoteGet_(url, timeoutMs) {
  const sep = url.indexOf("?") === -1 ? "?" : "&";
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, timeoutMs || 45000);
  try {
    const res = await fetch(url + sep + "_=" + Date.now(), {
      method: "GET",
      credentials: "omit",
      redirect: "follow",
      cache: "no-store",
      signal: ctrl ? ctrl.signal : undefined,
    });
    const text = (await res.text()).trim();
    let body = text;
    const m = text.match(/^[\w$.]+\(([\s\S]*)\)\s*;?\s*$/); // tolerate a JSONP-wrapped reply
    if (m && text.charAt(0) !== "{" && text.charAt(0) !== "[") body = m[1];
    return JSON.parse(body);
  } catch (e) {
    return jsonpRequest_(url, 20000); // last resort
  } finally {
    clearTimeout(timer);
  }
}

// Reads a Google Apps Script Web App via JSONP (a <script> tag), not fetch(). Apps
// Script issues an internal cross-origin redirect that many browsers refuse to
// expose to a plain fetch() when the page's origin is "null" (a local file opened
// directly, i.e. file://) or various external domains — the request gets blocked by
// CORS before the JSON is ever readable. A <script> tag load isn't subject to that
// restriction, which is why this works where fetch() doesn't.
function jsonpRequest_(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = "__eljuneinaCb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let done = false;
    const timer = setTimeout(() => finish(() => reject(new Error("JSONP timeout"))), timeoutMs || 15000);
    function cleanup() {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    }
    function finish(action) {
      if (done) return;
      done = true;
      cleanup();
      action();
    }
    window[cbName] = (data) => finish(() => resolve(data));
    script.onerror = () => finish(() => reject(new Error("JSONP load error")));
    const sep = url.indexOf("?") === -1 ? "?" : "&";
    script.src = url + sep + "callback=" + cbName;
    document.head.appendChild(script);
  });
}

function scheduleRemoteSync() {
  if (!isRemoteConfigured()) { syncStatus = "off"; return; }
  clearTimeout(remoteSyncTimer);
  remoteSyncTimer = setTimeout(pushRemoteState, 1200); // debounce rapid successive saves
}

async function pushRemoteState() {
  const cfg = loadRemoteConfig();
  if (!cfg || !cfg.url) { syncStatus = "off"; updateSyncBadge(); return; }
  if (remotePushInFlight) { remotePushQueued = true; return; }
  remotePushInFlight = true;
  syncStatus = "syncing";
  updateSyncBadge();
  const baseRevision = getLastSyncedRevision();
  const expectedRevision = baseRevision + 1;
  try {
    // The write itself is sent "blind": mode "no-cors" lets the POST actually reach
    // Apps Script and run (writing the sheet) even though the browser won't let us
    // read its response body — the same cross-origin redirect issue as above, but
    // there's no JSONP equivalent for POST. We verify what actually happened by
    // re-reading the state a moment later.
    await fetch(cfg.url, {
      method: "POST",
      mode: "no-cors",
      credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: cfg.token || "", baseRevision, state }),
    });
    await new Promise((r) => setTimeout(r, 900)); // give Apps Script a moment to finish writing
    const data = await remoteGet_(cfg.url + "?token=" + encodeURIComponent(cfg.token || ""));
    if (!data || !data.ok) {
      syncStatus = "error";
      if (data && data.error === "UNAUTHORIZED") alert(t("sync.unauthorizedAlert"));
      updateSyncBadge();
      return;
    }
    if (data.revision === expectedRevision) {
      // Revision advanced by exactly one from what we started with — our write applied cleanly.
      setLastSyncedRevision(data.revision);
      syncStatus = "synced";
    } else {
      // Either our write was rejected as stale, or someone else's write landed around
      // the same time. Either way, adopt the current server copy as the source of
      // truth — the local change that triggered this push may need to be redone.
      if (data.state) backupLocalStateBeforeReplace_("conflict");
      state = data.state ? { ...clone(DEFAULT_STATE), ...data.state } : state;
      normalizeUsers(state);
      safeStorageSet(localStorage, STORAGE_KEY, JSON.stringify(state));
      setLastSyncedRevision(data.revision);
      syncStatus = "conflict";
      reattachCurrentUserAfterRemoteReplace_();
      if (!modalContent) render();
      alert(t("sync.conflictAlert"));
    }
  } catch (e) {
    syncStatus = "offline";
  } finally {
    remotePushInFlight = false;
    updateSyncBadge();
    if (remotePushQueued) { remotePushQueued = false; scheduleRemoteSync(); }
  }
}

async function pullRemoteState(opts) {
  const silent = opts && opts.silent;
  const cfg = loadRemoteConfig();
  if (!cfg || !cfg.url) { syncStatus = "off"; updateSyncBadge(); return; }
  if (modalContent) return; // don't clobber whatever the user is typing right now
  try {
    const data = await remoteGet_(cfg.url + "?token=" + encodeURIComponent(cfg.token || ""));
    if (!data.ok) {
      if (data.error === "UNAUTHORIZED" && !silent) alert(t("sync.unauthorizedAlert"));
      syncStatus = "error";
      updateSyncBadge();
      return;
    }
    if (data.revision === 0 || data.state === null) {
      // Nothing in the sheet yet — seed it with whatever we already have locally.
      setLastSyncedRevision(0);
      pushRemoteState();
      return;
    }
    if (data.revision > getLastSyncedRevision()) {
      backupLocalStateBeforeReplace_("pull");
      state = { ...clone(DEFAULT_STATE), ...data.state };
      normalizeUsers(state);
      safeStorageSet(localStorage, STORAGE_KEY, JSON.stringify(state));
      setLastSyncedRevision(data.revision);
      syncStatus = "synced";
      reattachCurrentUserAfterRemoteReplace_();
      if (!modalContent) render(); else updateSyncBadge();
    } else {
      syncStatus = "synced";
      updateSyncBadge();
    }
  } catch (e) {
    syncStatus = "offline";
    updateSyncBadge();
  }
}

// After state is wholesale-replaced by a remote pull/conflict, currentUser (an object
// reference into the OLD state.users array) must be re-linked to the new array — or
// cleared out + logged out if another device deleted that account meanwhile.
function reattachCurrentUserAfterRemoteReplace_() {
  if (!currentUser) return;
  const stillExists = state.users.find((u) => u.id === currentUser.id);
  if (stillExists) {
    currentUser = stillExists;
  } else {
    currentUser = null;
    clearSession();
  }
}

function startRemotePolling() {
  clearInterval(remotePollTimer);
  if (!isRemoteConfigured()) return;
  remotePollTimer = setInterval(() => {
    if (currentUser) pullRemoteState({ silent: true });
  }, REMOTE_PULL_INTERVAL_MS);
}

function submitCloudConnect() {
  const url = document.getElementById("f_cloud_url").value.trim();
  const token = document.getElementById("f_cloud_token").value.trim();
  if (!url || !token) { alert(t("sync.missingFields")); return; }
  saveRemoteConfig({ url, token });
  setLastSyncedRevision(0); // force a fresh pull/seed against the new destination
  syncStatus = "idle";
  startRemotePolling();
  navigate("settings");
  pullRemoteState();
}

function submitCloudDisconnect() {
  if (!confirm(t("sync.confirmDisconnect"))) return;
  clearRemoteConfig();
  clearInterval(remotePollTimer);
  syncStatus = "off";
  navigate("settings");
}

function submitCloudSyncNow() {
  pullRemoteState().then(() => scheduleRemoteSync());
}

/* ---------------- Auth: session + users ---------------- */

function saveSession(userId, remember) {
  const primary = remember ? localStorage : sessionStorage;
  const other = remember ? sessionStorage : localStorage;
  safeStorageSet(primary, SESSION_KEY, userId);
  safeStorageRemove(other, SESSION_KEY);
}
function loadSessionUserId() {
  return safeStorageGet(localStorage, SESSION_KEY) || safeStorageGet(sessionStorage, SESSION_KEY);
}
function clearSession() {
  safeStorageRemove(localStorage, SESSION_KEY);
  safeStorageRemove(sessionStorage, SESSION_KEY);
}

const MIN_PASSWORD_LENGTH = 6;

const AuthService = {
  findUser(username) {
    return state.users.find((u) => u.username.toLowerCase() === (username || "").toLowerCase());
  },
  // Verifies a password against whatever format is currently stored (new PBKDF2,
  // or the old legacy hash from before real encryption was added).
  async _verify(user, password) {
    const stored = user.passwordHash || "";
    if (stored.startsWith("pbkdf2$")) {
      return CRYPTO_AVAILABLE ? verifyPasswordSecure(password || "", stored) : false;
    }
    return stored === simpleHash(password || "");
  },
  async login(username, password) {
    const user = this.findUser(username);
    if (!user) return null;
    const ok = await this._verify(user, password);
    if (!ok) return null;
    // Transparently upgrade any account still on the old legacy hash to real
    // salted PBKDF2 the moment it successfully logs in.
    if (!(user.passwordHash || "").startsWith("pbkdf2$") && CRYPTO_AVAILABLE) {
      user.passwordHash = await hashPasswordSecure(password || "");
      saveState();
    }
    return user;
  },
  async addUser({ username, password, role, permissions, canEditClosedFolios }) {
    username = (username || "").trim();
    if (!username || !password) return { ok: false, error: "MISSING" };
    if (password.length < MIN_PASSWORD_LENGTH) return { ok: false, error: "TOO_SHORT" };
    if (this.findUser(username)) return { ok: false, error: "DUPLICATE" };
    const passwordHash = await hashPassword(password);
    const normalizedRole = role === "admin" ? "admin" : "staff";
    // Staff accounts default to every non-Settings page — the admin can then
    // narrow this down per user from Settings > Users > Manage permissions.
    const normalizedPermissions = normalizedRole === "admin"
      ? []
      : (Array.isArray(permissions) ? permissions.filter((p) => NAV_PERMISSION_KEYS.includes(p)) : NAV_PERMISSION_KEYS.slice());
    const user = {
      id: uid("user"), username, passwordHash, createdAt: new Date().toISOString(),
      role: normalizedRole, permissions: normalizedPermissions,
      canEditClosedFolios: normalizedRole === "admin" ? false : canEditClosedFolios === true,
    };
    state.users.push(user);
    saveState();
    return { ok: true, user };
  },
  async changePassword(userId, currentPassword, newPassword) {
    const user = state.users.find((u) => u.id === userId);
    if (!user) return { ok: false, error: "NOT_FOUND" };
    const ok = await this._verify(user, currentPassword);
    if (!ok) return { ok: false, error: "WRONG_CURRENT" };
    if (!newPassword || newPassword.length < MIN_PASSWORD_LENGTH) return { ok: false, error: "TOO_SHORT" };
    user.passwordHash = await hashPassword(newPassword);
    saveState();
    return { ok: true };
  },
  // Only an admin can call this (enforced by the Settings UI being admin-only).
  // Refuses to demote the last remaining admin — the app must always keep at
  // least one account that can reach Settings and manage everyone else.
  setUserRole(userId, role) {
    const user = state.users.find((u) => u.id === userId);
    if (!user) return { ok: false, error: "NOT_FOUND" };
    const normalizedRole = role === "admin" ? "admin" : "staff";
    if (user.role === "admin" && normalizedRole !== "admin") {
      const adminCount = state.users.filter((u) => u.role === "admin").length;
      if (adminCount <= 1) return { ok: false, error: "lastAdminError" };
    }
    user.role = normalizedRole;
    if (normalizedRole === "admin") user.permissions = [];
    saveState();
    return { ok: true };
  },
  setUserPermissions(userId, permissions) {
    const user = state.users.find((u) => u.id === userId);
    if (!user) return { ok: false, error: "NOT_FOUND" };
    user.permissions = Array.isArray(permissions) ? permissions.filter((p) => NAV_PERMISSION_KEYS.includes(p)) : [];
    saveState();
    return { ok: true };
  },
  // Separate from page permissions: whether this (non-admin) user may edit or
  // delete transactions inside a folio that has already been closed
  // (checked out) — an override granted per user for fixing mistakes, not a
  // page they can navigate to.
  setUserCanEditClosedFolios(userId, allowed) {
    const user = state.users.find((u) => u.id === userId);
    if (!user) return { ok: false, error: "NOT_FOUND" };
    user.canEditClosedFolios = allowed === true;
    saveState();
    return { ok: true };
  },
  removeUser(userId) {
    if (state.users.length <= 1) return false; // always keep at least one account
    const user = state.users.find((u) => u.id === userId);
    if (user && user.role === "admin") {
      const adminCount = state.users.filter((u) => u.role === "admin").length;
      if (adminCount <= 1) return false; // never delete the last admin
    }
    state.users = state.users.filter((u) => u.id !== userId);
    saveState();
    return true;
  },
};

function money(n) {
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ---------------- currency ---------------- */
// The app is locked to USD — all amounts are stored and displayed in US
// dollars, with a "$" symbol.
function cv(amount) {
  return "$" + money(amount);
}
function currencySuffix() {
  return "";
}
function fmt(amount) {
  return cv(amount);
}
// Purchasing (supplier invoices) happens in Egyptian Pounds — the local cash
// currency — even though the rest of the app (guest pricing, folios, POS) is
// dollarized. This formatter is only used for that purchasing flow; everything
// entered through it is converted to its USD equivalent before being stored,
// so the accounting ledger stays in a single consistent currency (USD).
function egp(amount) {
  return money(amount) + " " + t("common.egp");
}
function usdToEgp(usdAmount) {
  return Number(usdAmount) * (state.usdRate || 1);
}
function egpToUsd(egpAmount) {
  return Number(egpAmount) / (state.usdRate || 1);
}

function t(path) {
  const parts = path.split(".");
  let node = STR[state.lang];
  for (const p of parts) node = node?.[p];
  return node ?? path;
}

/* ============================================================
   SERVICES — mirror the backend service-layer rules from the
   production schema (docs/DATABASE.md invariants), reimplemented
   client-side so this single-file app has correct business logic,
   not just UI.
   ============================================================ */

const FolioService = {
  getOrCreate(villaStayId) {
    if (!state.folios[villaStayId]) {
      state.folios[villaStayId] = { villaStayId, transactions: [], closedAt: null, discountPercent: 0 };
    }
    return state.folios[villaStayId];
  },
  // Manual discount %, entered at check-out time. Applies only to charges
  // (not to payments already received). Existing folios saved before this
  // feature simply have no discountPercent field, which totals() below
  // treats the same as 0 — no migration needed, nothing else changes.
  setDiscount(villaStayId, percent) {
    const folio = this.getOrCreate(villaStayId);
    const p = Number(percent);
    folio.discountPercent = Number.isFinite(p) && p > 0 ? Math.min(p, 100) : 0;
    saveState();
    return folio.discountPercent;
  },
  post(villaStayId, type, amount, note, meta) {
    const folio = this.getOrCreate(villaStayId);
    folio.transactions.push({ id: uid("ft"), type, amount, note: note || "", createdAt: new Date().toISOString(), meta: meta || null });
    saveState();
  },
  // Both of these are gated in the UI by canEditClosedFolio(currentUser) —
  // they exist to fix a mistake after checkout (wrong amount, wrong charge),
  // not for routine use, so the service layer doesn't re-check permissions
  // itself (the same as every other write in this file).
  updateTransaction(villaStayId, txId, { amount, note }) {
    const folio = state.folios[villaStayId];
    if (!folio) return false;
    const tx = folio.transactions.find((x) => x.id === txId);
    if (!tx) return false;
    if (amount != null && !Number.isNaN(Number(amount))) tx.amount = Number(amount);
    if (note != null) tx.note = note;
    saveState();
    return true;
  },
  removeTransaction(villaStayId, txId) {
    const folio = state.folios[villaStayId];
    if (!folio) return false;
    const before = folio.transactions.length;
    folio.transactions = folio.transactions.filter((x) => x.id !== txId);
    saveState();
    return folio.transactions.length < before;
  },
  // Wipes every transaction on this one folio (and resets its discount).
  // Gated the same as updateTransaction/removeTransaction above — only for
  // fixing a folio that's a genuine mistake. Does not touch any other
  // folio, stay, villa, or any other part of state.
  clearAll(villaStayId) {
    const folio = state.folios[villaStayId];
    if (!folio) return false;
    folio.transactions = [];
    folio.discountPercent = 0;
    saveState();
    return true;
  },
  totals(villaStayId) {
    const folio = state.folios[villaStayId];
    if (!folio) return { charges: 0, discountPercent: 0, discountAmount: 0, netCharges: 0, payments: 0, balance: 0 };
    let charges = 0, payments = 0;
    for (const tx of folio.transactions) {
      if (tx.type.startsWith("CHARGE")) charges += tx.amount;
      else payments += tx.amount;
    }
    const discountPercent = folio.discountPercent || 0;
    const discountAmount = charges * (discountPercent / 100);
    const netCharges = charges - discountAmount;
    return { charges, discountPercent, discountAmount, netCharges, payments, balance: netCharges - payments };
  },
  totalPaymentsReceived() {
    let sum = 0;
    for (const stayId in state.folios) {
      for (const tx of state.folios[stayId].transactions) {
        if (tx.type.startsWith("PAYMENT")) sum += tx.amount;
      }
    }
    return sum;
  },
  totalReceivables() {
    return state.villaStays
      .filter((s) => !s.checkOut)
      .reduce((sum, s) => sum + this.totals(s.id).balance, 0);
  },
};

const VillaService = {
  activeStay(villaId) {
    return state.villaStays.find((s) => s.villaId === villaId && !s.checkOut) || null;
  },
  checkIn(villaId, { guestName, phone, nationality, guestsCount }) {
    const villa = state.villas.find((v) => v.id === villaId);
    if (!villa || villa.status === "OCCUPIED") return null;
    const stay = {
      id: uid("stay"), villaId, guestName, phone, nationality,
      guestsCount: guestsCount || 1, checkIn: new Date().toISOString(), checkOut: null,
    };
    state.villaStays.push(stay);
    FolioService.getOrCreate(stay.id);
    villa.status = "OCCUPIED";
    saveState();
    return stay;
  },
  checkOut(villaId, villaStayId) {
    const stay = state.villaStays.find((s) => s.id === villaStayId);
    const villa = state.villas.find((v) => v.id === villaId);
    if (!stay || !villa) return;
    stay.checkOut = new Date().toISOString();
    const folio = FolioService.getOrCreate(villaStayId);
    folio.closedAt = new Date().toISOString();
    villa.status = "CLEANING";
    saveState();
  },
  markAvailable(villaId) {
    const villa = state.villas.find((v) => v.id === villaId);
    if (!villa || this.activeStay(villaId)) return false; // never override an occupied villa
    villa.status = "AVAILABLE";
    saveState();
    return true;
  },
};

const OrderService = {
  create({ type, villaStayId, items, paymentMethod, tableNumber, mealDate }) {
    const grandTotal = items.reduce((sum, it) => sum + it.price * it.qty, 0);
    const serviceDivisor = 1.2882;
    const subtotal = Math.round((grandTotal / serviceDivisor) * 100) / 100;
    const tax = Math.round((grandTotal - subtotal) * 100) / 100;
    const total = grandTotal;
    // Snapshot each item's category + bilingual name (+ its own meal date)
    // at order time, so the guest folio can be grouped by day and by meal
    // (Breakfast/Lunch/Dinner/Beverages) later — even if a product is
    // renamed/removed afterward, or the cart mixed several days in one order.
    const itemsWithMeta = items.map((it) => {
      const p = state.products.find((pr) => pr.id === it.productId);
      return {
        ...it,
        categoryId: it.categoryId || (p ? p.categoryId : null),
        mealDate: it.mealDate || mealDate || todayISO(),
        nameAr: p ? p.nameAr : it.productId,
        nameEn: p ? p.nameEn : it.productId,
      };
    });
    const order = {
      id: uid("order"),
      number: state.nextOrderNumber++,
      type,
      villaStayId: villaStayId || null,
      tableNumber: type === "DINE_IN" ? (tableNumber || "").trim() : "",
      items: itemsWithMeta,
      // Top-level date shown on the order receipt header — the earliest of
      // the item dates (a villa-service cart can span more than one day;
      // each item's own mealDate is what actually drives folio grouping).
      mealDate: villaStayId ? (itemsWithMeta.map(it => it.mealDate).sort()[0] || todayISO()) : todayISO(),
      subtotal,
      tax,
      total,
      paymentMethod: villaStayId ? "FOLIO" : paymentMethod,
      createdAt: new Date().toISOString(),
    };
    state.orders.push(order);

    // Villa Service orders post straight to the guest folio instead of
    // taking a direct payment — mirrors folio_transactions in the DB design.
    if (villaStayId) {
      FolioService.post(villaStayId, "CHARGE_RESTAURANT", total, `Order #${order.number}`, {
        orderId: order.id,
        orderNumber: order.number,
        mealDate: order.mealDate,
        items: itemsWithMeta,
      });
    }
    saveState();
    return order;
  },
  todayOrders() {
    const today = new Date().toDateString();
    return state.orders.filter((o) => new Date(o.createdAt).toDateString() === today);
  },
  inRange(fromDate) {
    if (!fromDate) return state.orders;
    return state.orders.filter((o) => new Date(o.createdAt) >= fromDate);
  },
};

const InventoryService = {
  // NOTE on currency: unitCost figures passed INTO this service (addItem, move,
  // recordPurchase) are always Egyptian Pounds — what the person actually pays
  // suppliers locally. They're converted to their USD equivalent (via
  // state.usdRate) before being stored on item.unitCost or turned into an
  // expense, so the rest of the ledger (which is USD-denominated, like guest
  // pricing) stays internally consistent. The original EGP figures are kept on
  // the stock movement itself (unitCostEGP/lineTotalEGP) for accurate historical
  // reporting, since a later change to the exchange rate shouldn't rewrite what
  // was actually paid at purchase time.
  addItem({ nameAr, nameEn, unit, qty, minQty, unitCost }) {
    const unitCostUsd = egpToUsd(Number(unitCost) || 0);
    const item = { id: uid("item"), nameAr, nameEn, unit: unit || "", qty: Number(qty) || 0, minQty: Number(minQty) || 0, unitCost: unitCostUsd };
    state.inventoryItems.push(item);
    saveState();
    return item;
  },
  move(itemId, type, qty, note, unitCostEgp, purchaseMeta) {
    const item = state.inventoryItems.find((i) => i.id === itemId);
    if (!item || !qty || qty <= 0) return false;
    if (type === "OUT" && qty > item.qty) return false; // can't go negative
    item.qty += type === "IN" ? qty : -qty;

    let expenseId = null;
    // A restock is a real cash outflow — log it as a SUPPLIES expense automatically
    // so purchasing and accounting stay in sync, instead of purchases going untracked.
    const hasCost = type === "IN" && unitCostEgp != null && Number(unitCostEgp) > 0;
    const unitCostUsd = hasCost ? egpToUsd(Number(unitCostEgp)) : null;
    if (hasCost) {
      item.unitCost = unitCostUsd;
      const itemName = state.lang === "ar" ? item.nameAr : item.nameEn;
      const supplierNote = purchaseMeta && purchaseMeta.supplier ? ` — ${purchaseMeta.supplier}` : "";
      const expense = ExpenseService.add({
        category: "SUPPLIES",
        amount: Math.round(qty * unitCostUsd * 100) / 100,
        note: `${itemName} x${qty} (${t("inventory.stockIn")})${supplierNote}`,
        paymentMethod: "CASH",
      });
      expenseId = expense ? expense.id : null;
    }

    const movement = { id: uid("mv"), itemId, type, qty, note: note || "", createdAt: new Date().toISOString(), expenseId };
    if (hasCost) {
      movement.unitCostEGP = Number(unitCostEgp);
      movement.lineTotalEGP = Math.round(qty * Number(unitCostEgp) * 100) / 100;
    }
    if (type === "IN" && purchaseMeta) {
      movement.supplier = purchaseMeta.supplier || "";
      movement.invoiceNumber = purchaseMeta.invoiceNumber || "";
      movement.purchaseDate = purchaseMeta.date || movement.createdAt;
    }
    state.stockMovements.unshift(movement);
    saveState();
    return true;
  },
  lowStock() {
    return state.inventoryItems.filter((i) => i.qty <= i.minQty);
  },
  // Multi-line purchase invoice (Odoo-style): one supplier + one invoice number + one date,
  // covering several item lines, settled as a single consolidated SUPPLIES expense —
  // instead of the quick single-item move() above, which logs its own small expense per call.
  // lines[].unitCost is EGP, same as everywhere else in this service.
  recordPurchase({ supplier, invoiceNumber, date, lines }) {
    const purchaseDate = date || new Date().toISOString();
    let totalAmountUsd = 0;
    const movementIds = [];
    for (const line of lines) {
      const item = state.inventoryItems.find((i) => i.id === line.itemId);
      const qty = Number(line.qty);
      if (!item || !qty || qty <= 0) continue;
      const unitCostEgp = Number(line.unitCost) || 0;
      const unitCostUsd = egpToUsd(unitCostEgp);
      item.qty += qty;
      if (unitCostEgp > 0) item.unitCost = unitCostUsd;
      totalAmountUsd += qty * unitCostUsd;

      const movement = {
        id: uid("mv"), itemId: item.id, type: "IN", qty, note: "",
        createdAt: new Date().toISOString(), expenseId: null,
        supplier: supplier || "", invoiceNumber: invoiceNumber || "", purchaseDate,
      };
      if (unitCostEgp > 0) {
        movement.unitCostEGP = unitCostEgp;
        movement.lineTotalEGP = Math.round(qty * unitCostEgp * 100) / 100;
      }
      state.stockMovements.unshift(movement);
      movementIds.push(movement.id);
    }

    if (movementIds.length === 0) return { count: 0, total: 0, expenseId: null };

    let expenseId = null;
    if (totalAmountUsd > 0) {
      const refParts = [supplier, invoiceNumber ? `#${invoiceNumber}` : ""].filter(Boolean).join(" — ");
      const expense = ExpenseService.add({
        category: "SUPPLIES",
        amount: Math.round(totalAmountUsd * 100) / 100,
        note: `${t("inventory.addPurchase")}${refParts ? " — " + refParts : ""} (${movementIds.length}x)`,
        paymentMethod: "CASH",
      });
      expenseId = expense ? expense.id : null;
      if (expenseId) {
        for (const mv of state.stockMovements) {
          if (movementIds.includes(mv.id)) mv.expenseId = expenseId;
        }
      }
    }

    saveState();
    return { count: movementIds.length, totalUsd: totalAmountUsd, totalEgp: usdToEgp(totalAmountUsd), expenseId };
  },
  removeItem(itemId) {
    state.inventoryItems = state.inventoryItems.filter((i) => i.id !== itemId);
    // Keep stock-movement history intact for reporting even after the item is deleted;
    // renderInventory already handles a movement whose item no longer exists.
    saveState();
    return true;
  },
};

const TourService = {
  book({ tourId, villaStayId, guestName, pax, date }) {
    const tour = state.tours.find((tr) => tr.id === tourId);
    if (!tour) return null;
    const booking = {
      id: uid("tb"), tourId, villaStayId: villaStayId || null,
      guestName: guestName || (villaStayId ? state.villaStays.find(s => s.id === villaStayId)?.guestName : "") || "",
      pax: Number(pax) || 1, date: date || new Date().toISOString().slice(0, 10),
      status: "BOOKED", price: tour.price, paymentMethod: null,
    };
    state.tourBookings.push(booking);
    if (villaStayId) {
      FolioService.post(villaStayId, "CHARGE_TOUR", tour.price, `Tour: ${tour.nameEn}`);
      booking.paymentMethod = "FOLIO";
    }
    saveState();
    return booking;
  },
  setStatus(bookingId, status) {
    const b = state.tourBookings.find((x) => x.id === bookingId);
    if (!b) return;
    b.status = status;
    saveState();
  },
  payCash(bookingId) {
    const b = state.tourBookings.find((x) => x.id === bookingId);
    if (!b) return;
    b.paymentMethod = "CASH";
    saveState();
  },
};

const ExpenseService = {
  add({ category, amount, note, paymentMethod }) {
    const amt = Number(amount);
    if (!amt || amt <= 0) return null;
    const expense = {
      id: uid("exp"), number: state.nextExpenseNumber++, category: category || "OTHER",
      amount: amt, note: note || "", paymentMethod: paymentMethod || "CASH", createdAt: new Date().toISOString(),
    };
    state.expenses.push(expense);
    saveState();
    return expense;
  },
  remove(expenseId) {
    state.expenses = state.expenses.filter((e) => e.id !== expenseId);
    saveState();
  },
  total() {
    return state.expenses.reduce((s, e) => s + e.amount, 0);
  },
  totalByMethod(method) {
    return state.expenses.filter((e) => e.paymentMethod === method).reduce((s, e) => s + e.amount, 0);
  },
};

const CatalogService = {
  addVilla({ nameAr, nameEn, code }) {
    const villa = { id: uid("v"), code: code || "", nameAr, nameEn, status: "AVAILABLE" };
    state.villas.push(villa);
    saveState();
    return villa;
  },
  removeVilla(villaId) {
    if (VillaService.activeStay(villaId)) return false; // don't delete an occupied villa
    state.villas = state.villas.filter((v) => v.id !== villaId);
    saveState();
    return true;
  },
  addCategory({ nameAr, nameEn, group }) {
    const cat = { id: uid("c"), nameAr, nameEn, group: group === "BEVERAGE" ? "BEVERAGE" : "FOOD" };
    state.categories.push(cat);
    saveState();
    return cat;
  },
  removeCategory(categoryId) {
    if (state.products.some((p) => p.categoryId === categoryId)) return false; // keep referential integrity
    state.categories = state.categories.filter((c) => c.id !== categoryId);
    saveState();
    return true;
  },
  addProduct({ categoryId, nameAr, nameEn, price }) {
    const product = { id: uid("p"), categoryId, nameAr, nameEn, price: Number(price) || 0 };
    state.products.push(product);
    saveState();
    return product;
  },
  removeProduct(productId) {
    state.products = state.products.filter((p) => p.id !== productId);
    saveState();
  },
  updateProduct(productId, { nameAr, nameEn, price }) {
    const product = state.products.find((p) => p.id === productId);
    if (!product) return null;
    if (nameAr !== undefined) product.nameAr = nameAr;
    if (nameEn !== undefined) product.nameEn = nameEn;
    if (price !== undefined) product.price = Number(price) || 0;
    saveState();
    return product;
  },
  addTour({ nameAr, nameEn, price }) {
    const tour = { id: uid("tr"), nameAr, nameEn, price: Number(price) || 0 };
    state.tours.push(tour);
    saveState();
    return tour;
  },
  removeTour(tourId) {
    state.tours = state.tours.filter((tr) => tr.id !== tourId);
    saveState();
  },
  updateTour(tourId, { nameAr, nameEn, price }) {
    const tour = state.tours.find((tr) => tr.id === tourId);
    if (!tour) return null;
    if (nameAr !== undefined) tour.nameAr = nameAr;
    if (nameEn !== undefined) tour.nameEn = nameEn;
    if (price !== undefined) tour.price = Number(price) || 0;
    saveState();

async function submitLogin() {
  try {
    const username = document.getElementById("f_login_username").value;
    const password = document.getElementById("f_login_password").value;
    const remember = document.getElementById("f_login_remember").checked;

    if (isLockedOut(username)) {
      loginError = "accountLocked";
      loginLockoutSeconds = lockoutSecondsLeft(username);
      render();
      return;
    }

    const user = await AuthService.login(username, password);
    if (!user) {
      recordFailedAttempt(username);
      if (isLockedOut(username)) {
        loginError = "accountLocked";
        loginLockoutSeconds = lockoutSecondsLeft(username);
      } else {
        loginError = "invalidCredentials";
      }
      render();
      return;
    }
    clearLockout(username);
    loginError = null;
    currentUser = user;
    saveSession(user.id, remember);
    currentRoute = "dashboard";
    render();
  } catch (e) {
    // Should be unreachable (storage/crypto calls are now safe-guarded), but if anything
    // still slips through, surface it instead of leaving the button looking dead.
    console.error("Login failed unexpectedly:", e);
    alert("Login error: " + e.message);
  }
}

function handleLogout() {
  clearSession();
  currentUser = null;
  loginError = null;
  render();
}

function isAdmin(user) {
  return !!user && user.role === "admin";
}
function canAccess(user, navKey) {
  if (!user) return false;
  if (navKey === "settings") return isAdmin(user);
  if (isAdmin(user)) return true;
  return Array.isArray(user.permissions) && user.permissions.includes(navKey);
}
function accessibleNavKeys(user) {
  return NAV.map((n) => n.key).filter((key) => canAccess(user, key));
}
// A closed (checked-out) folio is normally locked. Admins can always fix
// mistakes in it; a specific staff member can be granted the same right
// individually (Settings > Users > Manage permissions) without making them
// an admin or handing them any other page access.
function canEditClosedFolio(user) {
  return isAdmin(user) || !!(user && user.canEditClosedFolios);
}

function exportBackup() {
  const json = JSON.stringify(state, null, 2);
  try {
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "eljuneina-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch {
    // Fallback for restrictive webviews that block Blob downloads.
    const win = window.open();
    if (win) {
      win.document.write("<pre>" + json.replace(/</g, "&lt;") + "</pre>");
    } else {
      alert(json);
    }
  }
}
function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      state = { ...clone(DEFAULT_STATE), ...JSON.parse(reader.result) };
      normalizeUsers(state);
      saveState();
      modalContent = null;
      handleLogout(); // imported data may have a different set of users — require signing in again
    } catch {
      alert("Invalid backup file");
    }
  };
  reader.readAsText(file);
}
function resetData() {
  if (!confirm(t("common.confirmReset"))) return;
  state = clone(DEFAULT_STATE);
  saveState();
  modalContent = null;
  handleLogout(); // reset wipes custom users too — back to the default Admin account
}

// Groups a guest's folio into: (1) restaurant/villa-service charges broken
// down by calendar day → meal category (Breakfast/Lunch/Dinner/Beverages),
// (2) other charges (tours, manual charges), (3) payments. Used by both the
// on-screen folio view and the printed statement, so multi-day stays show
// exactly which meals were taken on which day instead of one flat total.
function groupFolioByDate(stay) {
  const folio = FolioService.getOrCreate(stay.id);
  const dateMap = {};
  const otherCharges = [];
  const payments = [];

  for (const tx of folio.transactions) {
    if (tx.type === "CHARGE_RESTAURANT" && tx.meta && Array.isArray(tx.meta.items)) {
      for (const it of tx.meta.items) {
        // Each item carries its own meal date (a single order can mix days),
        // falling back to the order-level date for older saved data.
        const date = it.mealDate || tx.meta.mealDate || tx.createdAt.slice(0, 10);
        if (!dateMap[date]) dateMap[date] = { categories: {}, dateTotal: 0 };
        const bucket = dateMap[date];
        const catKey = it.categoryId || "other";
        if (!bucket.categories[catKey]) bucket.categories[catKey] = { items: {}, subtotal: 0 };
        const catBucket = bucket.categories[catKey];
        const itemKey = it.productId + "@" + it.price;
        const name = state.lang === "ar" ? it.nameAr : it.nameEn;
        if (!catBucket.items[itemKey]) catBucket.items[itemKey] = { name, qty: 0, price: it.price };
        catBucket.items[itemKey].qty += it.qty;
        catBucket.subtotal += it.price * it.qty;
        bucket.dateTotal += it.price * it.qty;
      }
    } else if (tx.type.startsWith("CHARGE")) {
      otherCharges.push(tx);
    } else {
      payments.push(tx);
    }
  }

  const otherLabel = state.lang === "ar" ? "أصناف أخرى" : "Other items";
  const dateGroups = Object.keys(dateMap).sort().map((date) => {
    const d = dateMap[date];
    const categories = state.categories
      .filter((cat) => d.categories[cat.id])
      .map((cat) => ({
        label: state.lang === "ar" ? cat.nameAr : cat.nameEn,
        items: Object.values(d.categories[cat.id].items),
        subtotal: d.categories[cat.id].subtotal,
      }));
    if (d.categories.other) {
      categories.push({ label: otherLabel, items: Object.values(d.categories.other.items), subtotal: d.categories.other.subtotal });
    }
    return { date, categories, dateTotal: d.dateTotal };
  });

  return { dateGroups, otherCharges, payments };
}

function fmtFolioDate(dateStr) {
  // dateStr is a plain YYYY-MM-DD; build a local Date at noon to avoid
  // timezone rollover shifting it to the previous/next day when displayed.
  const d = new Date(dateStr + "T12:00:00");
  return d.toLocaleDateString(state.lang === "ar" ? "ar-EG" : "en-US", { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}

function renderFolioDetail(stay) {
  const { dateGroups, otherCharges, payments } = groupFolioByDate(stay);

  const dateGroupsHtml = dateGroups.length === 0 ? "" : dateGroups.map((g, i) => `
    <div class="mb-3 rounded-lg border border-brand-200 dark:border-brand-700 overflow-hidden">
      <div class="flex justify-between items-center bg-brand-50 dark:bg-brand-800 px-3 py-1.5 text-xs font-semibold">
        <span>${t("villas.day")} ${i + 1} — ${fmtFolioDate(g.date)}</span>
        <span>${cv(g.dateTotal)}</span>
      </div>
      <div class="p-2 space-y-2">
        ${g.categories.map((c) => `
          <div>
            <p class="text-[11px] font-semibold text-brand-700/70 dark:text-brand-100/60">${c.label}</p>
            ${c.items.map((it) => `
              <div class="flex justify-between text-xs ps-2">
                <span>${it.name} × ${it.qty}</span>
                <span>${cv(it.price * it.qty)}</span>
              </div>`).join("")}
          </div>`).join("")}
      </div>
    </div>`).join("");

  const otherChargesHtml = otherCharges.length === 0 ? "" : `
    <p class="mb-1 text-[11px] font-semibold text-brand-700/70 dark:text-brand-100/60">${t("villas.otherCharges")}</p>
    <div class="mb-3 space-y-1">
      ${otherCharges.map((tx) => `
        <div class="flex justify-between text-xs">
          <span>${tx.note || tx.type}</span>
          <span class="text-red-600">+${cv(tx.amount)}</span>
        </div>`).join("")}
    </div>`;

  const paymentsHtml = payments.length === 0 ? "" : `
    <p class="mb-1 text-[11px] font-semibold text-brand-700/70 dark:text-brand-100/60">${t("villas.payments")}</p>
    <div class="space-y-1">
      ${payments.map((tx) => `
        <div class="flex justify-between text-xs">
          <span>${tx.note || tx.type}</span>
          <span class="text-green-600">-${cv(tx.amount)}</span>
        </div>`).join("")}
    </div>`;

  if (dateGroups.length === 0 && otherCharges.length === 0 && payments.length === 0) {
    return `<p class="p-3 text-xs text-brand-700/50">${t("villas.noTransactions")}</p>`;
  }
  return dateGroupsHtml + otherChargesHtml + paymentsHtml;
}

// The discount % is entered once, here in the open folio (before check-out),
// so it's calculated a single time rather than re-entered at check-out.
// Saves immediately and re-renders this same modal with the new totals.
function updateFolioDiscount(villaStayId, percent) {
  FolioService.setDiscount(villaStayId, percent);
  const stay = state.villaStays.find(s => s.id === villaStayId);
  if (stay) openVillaModal(stay.villaId);
}

function handleCheckOutClick(villaId, villaStayId) {
  if (!confirm(t("villas.confirmCheckout"))) return;
  submitCheckOut(villaId, villaStayId);
}

function submitCheckIn(villaId) {
  const guestName = document.getElementById("f_guestName").value.trim();
  if (!guestName) { alert(t("villas.guestName")); return; }
  const phone = document.getElementById("f_phone").value.trim();
  const nationality = document.getElementById("f_nationality").value.trim();
  const guestsCount = Number(document.getElementById("f_guests").value) || 1;
  VillaService.checkIn(villaId, { guestName, phone, nationality, guestsCount });
  closeModal();
  navigate("villas");
}

function addFolioPayment(villaStayId) {
  const amount = Number(document.getElementById("f_paymentAmount").value);
  if (!amount || amount <= 0) return;
  FolioService.post(villaStayId, "PAYMENT_CASH", amount, t("villas.addPayment"));
  const stay = state.villaStays.find(s => s.id === villaStayId);
  openVillaModal(stay.villaId);
}

function submitCheckOut(villaId, villaStayId) {
  VillaService.checkOut(villaId, villaStayId);
  delete posVillaCarts[villaStayId]; // guest is gone — drop any leftover open POS cart for this stay
  if (posVillaStayId === villaStayId) { posVillaStayId = ""; posCart = []; }
  closeModal();
  navigate("villas");
}

/* ---------------- Closed folio viewer / editor (opened from Reports > Past guest stays) ----------------
   A folio is locked once its stay has checked out. Everyone can open it to
   review or reprint the statement; only an admin, or a staff member
   explicitly granted the right (Settings > Users > Manage permissions), sees
   the edit/delete controls needed to fix a posting mistake after the fact. */

function openClosedFolioModal(villaStayId) {
  const stay = state.villaStays.find(s => s.id === villaStayId);
  if (!stay) return;
  const villa = state.villas.find(v => v.id === stay.villaId);
  const name = villa ? (state.lang === "ar" ? villa.nameAr : villa.nameEn) : "—";
  const folio = FolioService.getOrCreate(villaStayId);
  const totals = FolioService.totals(villaStayId);
  const editable = canEditClosedFolio(currentUser);

  const txList = folio.transactions.slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const txHtml = txList.length === 0 ? `<p class="p-3 text-xs text-brand-700/50">${t("villas.noTransactions")}</p>` : txList.map(tx => {
    const isCharge = tx.type.startsWith("CHARGE");
    return `
      <div class="flex items-center gap-2 py-1.5 text-xs border-b border-brand-100 dark:border-brand-800 last:border-b-0">
        <div class="flex-1 min-w-0">
          <p class="truncate">${tx.note || tx.type}</p>
          <p class="text-[10px] text-brand-700/50 dark:text-brand-100/40">${new Date(tx.createdAt).toLocaleString()}</p>
        </div>
        <span class="${isCharge ? "text-red-600" : "text-green-600"} font-medium whitespace-nowrap">${isCharge ? "+" : "-"}${cv(tx.amount)}</span>
        ${editable ? `
          <button onclick="openEditFolioTxModal('${villaStayId}','${tx.id}')" class="shrink-0 text-brand-700 dark:text-brand-100" title="${t('common.edit')}">✏️</button>
          <button onclick="handleDeleteFolioTx('${villaStayId}','${tx.id}')" class="shrink-0 text-red-500" title="${t('common.delete')}">🗑️</button>
        ` : ""}
      </div>`;
  }).join("");

  openModal(`
    <h2 class="mb-1 text-lg font-bold text-brand-800 dark:text-brand-100">${name} — ${t("villas.closedFolioTitle")}</h2>
    <p class="mb-1 text-sm text-brand-700 dark:text-brand-100/80">${stay.guestName}${stay.phone ? " — " + stay.phone : ""}</p>
    <p class="mb-4 text-xs text-brand-700/60 dark:text-brand-100/50">${new Date(stay.checkIn).toLocaleDateString()} → ${stay.checkOut ? new Date(stay.checkOut).toLocaleDateString() : ""}</p>

    <div class="flex items-center justify-between mb-2">
      <h3 class="text-sm font-semibold">${t("villas.folio")}</h3>
      <button onclick="printFolioInvoice('${villaStayId}')" class="text-xs text-brand-800 dark:text-brand-100 underline">🖨️ ${t("villas.printStatement")}</button>
    </div>
    <div class="max-h-64 overflow-y-auto rounded-lg border border-brand-200 dark:border-brand-700 p-2 mb-3">
      ${txHtml}
    </div>
    ${totals.discountPercent > 0 ? `
    <div class="flex justify-between text-xs text-red-600 mb-2 px-1">
      <span>${t("villas.discountPercent")}: ${totals.discountPercent}%</span>
      <span>-${cv(totals.discountAmount)}</span>
    </div>` : ""}
    <div class="grid grid-cols-3 gap-2 text-center mb-4">
      <div class="rounded-lg bg-brand-50 dark:bg-brand-800 p-2"><p class="text-[10px] text-brand-700/60 dark:text-brand-100/50">${t("villas.charges")}</p><p class="font-semibold">${cv(totals.discountPercent > 0 ? totals.netCharges : totals.charges)}</p></div>
      <div class="rounded-lg bg-brand-50 dark:bg-brand-800 p-2"><p class="text-[10px] text-brand-700/60 dark:text-brand-100/50">${t("villas.payments")}</p><p class="font-semibold">${cv(totals.payments)}</p></div>
      <div class="rounded-lg bg-brand-50 dark:bg-brand-800 p-2"><p class="text-[10px] text-brand-700/60 dark:text-brand-100/50">${t("villas.balance")}</p><p class="font-semibold ${totals.balance > 0 ? 'text-red-600' : 'text-green-600'}">${cv(totals.balance)}</p></div>
    </div>
    ${!editable ? `<p class="mb-3 text-xs text-amber-600 dark:text-amber-400">🔒 ${t("villas.folioLockedNote")}</p>` : ""}
    ${editable && txList.length > 0 ? `
    <button onclick="handleClearFolio('${villaStayId}')" class="mb-2 w-full rounded-lg border border-red-300 dark:border-red-700 text-red-600 px-4 py-2 text-sm">🗑️ ${t("villas.clearFolio")}</button>` : ""}
    <button onclick="closeModal()" class="w-full rounded-lg border border-brand-300 dark:border-brand-700 px-4 py-2 text-sm">${t("villas.close")}</button>
  `);
}

function openEditFolioTxModal(villaStayId, txId) {
  if (!canEditClosedFolio(currentUser)) return;
  const folio = state.folios[villaStayId];
  const tx = folio && folio.transactions.find(x => x.id === txId);
  if (!tx) return;
  openModal(`
    <h2 class="mb-4 text-lg font-bold text-brand-800 dark:text-brand-100">${t("villas.editTransaction")}</h2>
    <div class="space-y-2">
      <input id="f_tx_note" value="${escAttr(tx.note || "")}" placeholder="${t('villas.note')}" class="w-full rounded-lg border border-brand-300 dark:border-brand-700 dark:bg-brand-800 px-3 py-2 text-sm" />
      <input id="f_tx_amount" type="number" min="0" step="0.01" value="${tx.amount}" placeholder="${t('villas.amount')}" class="w-full rounded-lg border border-brand-300 dark:border-brand-700 dark:bg-brand-800 px-3 py-2 text-sm" />
    </div>
    <div class="mt-4 flex gap-2">
      <button onclick="submitEditFolioTx('${villaStayId}','${txId}')" class="flex-1 rounded-lg bg-brand-800 py-2 text-sm text-white">${t("common.save")}</button>
      <button onclick="openClosedFolioModal('${villaStayId}')" class="rounded-lg border border-brand-300 dark:border-brand-700 px-4 py-2 text-sm">${t("common.cancel")}</button>
    </div>
  `);
}

function submitEditFolioTx(villaStayId, txId) {
  if (!canEditClosedFolio(currentUser)) return;
  const note = document.getElementById("f_tx_note").value.trim();
  const amount = Number(document.getElementById("f_tx_amount").value);
  if (Number.isNaN(amount) || amount < 0) return;
  FolioService.updateTransaction(villaStayId, txId, { amount, note });
  openClosedFolioModal(villaStayId);
}

function handleDeleteFolioTx(villaStayId, txId) {
  if (!canEditClosedFolio(currentUser)) return;
  if (!confirmDelete()) return;
  FolioService.removeTransaction(villaStayId, txId);
  openClosedFolioModal(villaStayId);
}

// Deletes every transaction on this one closed folio in one go (e.g. it was
// posted against the wrong guest entirely). Only this folio is affected —
// the stay record, the villa, and every other folio stay untouched.
function handleClearFolio(villaStayId) {
  if (!canEditClosedFolio(currentUser)) return;
  if (!confirmDelete()) return;
  FolioService.clearAll(villaStayId);
  openClosedFolioModal(villaStayId);
}

let posCart = []; // [{lineId, productId, qty, mealDate, categoryId}] — cart currently shown on screen.
                    // mealDate/categoryId are set per line (not per whole order) so a single Villa
                    // Service cart can mix, e.g., yesterday's dinner with today's breakfast.
let posOrderType = "DINE_IN";
let posVillaStayId = "";
let posTableNumber = "";
let posMealDate = todayISO(); // which calendar day a Villa Service order is logged against
let posVillaCarts = {}; // { [villaStayId]: cart array } — keeps each villa's own open cart
                          // when switching between villas in Villa Service mode, until checkout
let posMenuGroup = "FOOD"; // "FOOD" or "BEVERAGE" — which POS menu tab is showing
function setPosMenuGroup(group) {
  posMenuGroup = group;
  navigate("pos");
}

function renderPOS() {
  const occupiedStays = state.villaStays.filter(s => !s.checkOut);

  const cartLines = posCart.map(line => {
    const p = state.products.find(pr => pr.id === line.productId);
    return { ...line, product: p, lineTotal: p.price * line.qty };
  });
  const cartGrandTotal = cartLines.reduce((s, l) => s + l.lineTotal, 0);
  const cartServiceDivisor = 1.2882;
  const cartTotal = Math.round((cartGrandTotal / cartServiceDivisor) * 100) / 100;
  const cartTax = Math.round((cartGrandTotal - cartTotal) * 100) / 100;

  return `
    <h1 class="mb-4 text-xl font-bold text-brand-800 dark:text-brand-100">${t("pos.title")}</h1>

    <div class="mb-4 flex flex-wrap gap-2">
      ${["DINE_IN", "TAKEAWAY", "DELIVERY", "VILLA_SERVICE"].map(type => `
        <button onclick="setOrderType('${type}')" class="rounded-full px-3 py-1.5 text-sm border ${posOrderType === type ? "bg-brand-800 text-white border-brand-800" : "border-brand-300 dark:border-brand-700"}">
          ${t("pos." + { DINE_IN: "dineIn", TAKEAWAY: "takeaway", DELIVERY: "delivery", VILLA_SERVICE: "villaService" }[type])}

      <td style="padding:6px 8px;border-bottom:1px solid #ddd;text-align:${isAr ? "left" : "right"};">${cv(l.price * l.qty)}</td>

        .meta { margin-bottom: 8px; font-size: 13px; }
        .totals { margin-top: 14px; width: 100%; max-width: 280px; ${isAr ? "margin-right:auto;" : "margin-left:auto;"} }
        .totals div { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
        .totals .grand { font-weight: bold; font-size: 15px; border-top: 1px solid #333; margin-top: 4px; padding-top: 6px; }
      </style>
    </head>
    <body>
      <img src="${window.LOGO_SRC}" style="height:48px;width:48px;border-radius:9999px;object-fit:cover;margin-bottom:8px;" />
      <h2>${appName}</h2>
      <div class="muted">${dateStr}</div>

        ${paymentMethod ? `<div>${t("pos.paymentMethod")}: ${paymentMethod}</div>` : ""}
      </div>

        <thead>

            <th style="text-align:${isAr ? "left" : "right"};">${isAr ? "الإجمالي" : "Total"}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>

      <div class="totals">

        <div class="grand"><span>${t("pos.total")}</span><span>${fmt(total)}</span></div>

function openAndPrint(html) {
  const printWindow = window.open("", "_blank", "width=420,height=600");
  if (!printWindow) {
    alert(state.lang === "ar" ? "الرجاء السماح بالنوافذ المنبثقة للطباعة" : "Please allow pop-ups to print");
    return;
  }
  printWindow.document.write(html);
  printWindow.document.close();
  printWindow.onload = () => {
    printWindow.focus();
    printWindow.print();
  };
}

function printCartInvoice() {
  if (posCart.length === 0) return;
  const isVillaService = posOrderType === "VILLA_SERVICE";
  const lines = posCart.map(line => {
    const p = state.products.find(pr => pr.id === line.productId);
    let name = state.lang === "ar" ? p.nameAr : p.nameEn;
    if (isVillaService) {
      const cat = state.categories.find(c => c.id === line.categoryId);
      const catLabel = cat ? (state.lang === "ar" ? cat.nameAr : cat.nameEn) : "";
      name = `${name} — ${catLabel}, ${fmtFolioDate(line.mealDate)}`;
    }
    return { name, qty: line.qty, price: p.price };
  });
  const grandTotal = lines.reduce((s, l) => s + l.price * l.qty, 0);
  const serviceDivisor = 1.2882;
  const subtotal = Math.round((grandTotal / serviceDivisor) * 100) / 100;
  const tax = Math.round((grandTotal - subtotal) * 100) / 100;
  const total = grandTotal;
  const taxRatePercent = state.taxRatePercent || 0;

  let villaLabel = "";
  if (isVillaService && posVillaStayId) {
    const stay = state.villaStays.find(s => s.id === posVillaStayId);
    if (stay) {
      const v = state.villas.find(v => v.id === stay.villaId);
      const name = v ? (state.lang === "ar" ? v.nameAr : v.nameEn) : "";
      villaLabel = `${name} — ${stay.guestName}`;
    }
  }
  const cartDates = [...new Set(posCart.map(l => l.mealDate))];

  const html = buildInvoiceHTML({
    number: "",
    dateStr: new Date().toLocaleString(state.lang === "ar" ? "ar-EG" : "en-US"),
    lines,
    subtotal,
    tax,
    total,
    taxRatePercent,
    tableNumber: posOrderType === "DINE_IN" ? posTableNumber : "",
    villaLabel,
    mealDateStr: isVillaService && cartDates.length === 1 ? fmtFolioDate(cartDates[0]) : "",
    paymentMethod: isVillaService ? t("pos.postToFolio") : "",
  });
  openAndPrint(html);
}

function printOrderInvoice(order) {
  const orderDates = [...new Set(order.items.map(it => it.mealDate).filter(Boolean))];
  const lines = order.items.map(it => {
    const p = state.products.find(pr => pr.id === it.productId);
    let name = p ? (state.lang === "ar" ? p.nameAr : p.nameEn) : it.productId;
    if (order.villaStayId) {
      const cat = state.categories.find(c => c.id === it.categoryId);
      const catLabel = cat ? (state.lang === "ar" ? cat.nameAr : cat.nameEn) : "";
      name = `${name} — ${catLabel}${it.mealDate ? `, ${fmtFolioDate(it.mealDate)}` : ""}`;
    }
    return { name, qty: it.qty, price: it.price };
  });

  let villaLabel = "";
  if (order.villaStayId) {
    const stay = state.villaStays.find(s => s.id === order.villaStayId);
    if (stay) {
      const v = state.villas.find(v => v.id === stay.villaId);
      const name = v ? (state.lang === "ar" ? v.nameAr : v.nameEn) : "";
      villaLabel = `${name} — ${stay.guestName}`;
    }
  }

  const html = buildInvoiceHTML({
    number: order.number,
    dateStr: new Date(order.createdAt).toLocaleString(state.lang === "ar" ? "ar-EG" : "en-US"),
    lines,
    subtotal: order.subtotal,
    tax: order.tax,
    total: order.total,
    taxRatePercent: state.taxRatePercent || 0,
    tableNumber: order.tableNumber,
    villaLabel,
    mealDateStr: order.villaStayId && orderDates.length === 1 ? fmtFolioDate(orderDates[0]) : "",
    paymentMethod: order.paymentMethod === "FOLIO" ? t("pos.postToFolio") : order.paymentMethod,
  });
  openAndPrint(html);
}

function setOrderType(type) {
  // Leaving Villa Service: park this villa's cart so it's still there when we come back to it
  if (posOrderType === "VILLA_SERVICE" && posVillaStayId) {
    posVillaCarts[posVillaStayId] = posCart;
  }
  posOrderType = type;
  if (type !== "VILLA_SERVICE") {
    posVillaStayId = "";
  } else {
    // Entering Villa Service: restore whichever villa was already selected, or start empty
    posCart = posVillaStayId ? (posVillaCarts[posVillaStayId] || []) : [];
  }
  if (type !== "DINE_IN") posTableNumber = "";

}

function handlePosVillaSelect(value) {

}

function submitPosCheckIn() {
  const villaId = document.getElementById("f_pos_villaId").value;
  const guestName = document.getElementById("f_guestName").value.trim();
  if (!guestName) { alert(t("villas.guestName")); return; }
  const phone = document.getElementById("f_phone").value.trim();
  const nationality = document.getElementById("f_nationality").value.trim();
  const guestsCount = Number(document.getElementById("f_guests").value) || 1;
  VillaService.checkIn(villaId, { guestName, phone, nationality, guestsCount });
  const newStay = VillaService.activeStay(villaId);
  // Park the cart of the villa we're leaving, then start a fresh cart for the new guest
  if (posVillaStayId) {
    posVillaCarts[posVillaStayId] = posCart;
  }
  posVillaStayId = newStay ? newStay.id : "";
  posCart = posVillaStayId ? (posVillaCarts[posVillaStayId] || []) : [];
  closeModal();
}

function addToCart(productId) {
  const p = state.products.find((pr) => pr.id === productId);
  if (posOrderType === "VILLA_SERVICE") {
    // Merge into an existing line only if it's the same product on the same
    // day and meal — otherwise a fresh line is started, since the date/meal
    // can later be edited independently per line.
    const mealDate = posMealDate;
    const categoryId = p ? p.categoryId : null;
    const line = posCart.find(l => l.productId === productId && l.mealDate === mealDate && l.categoryId === categoryId);
    if (line) line.qty += 1;
    else posCart.push({ lineId: uid("cl"), productId, qty: 1, mealDate, categoryId });
  } else {
    const line = posCart.find(l => l.productId === productId);
    if (line) line.qty += 1;
    else posCart.push({ lineId: uid("cl"), productId, qty: 1 });
  }
  render();
}
function increaseCartLine(lineId) {
  const line = posCart.find(l => l.lineId === lineId);
  if (line) line.qty += 1;
  render();
}
function removeFromCart(lineId) {
  posCart = posCart.filter(l => l.lineId !== lineId);
  render();
}
function decreaseFromCart(lineId) {
  const line = posCart.find(l => l.lineId === lineId);
  if (!line) return;
  line.qty -= 1;
  if (line.qty <= 0) posCart = posCart.filter(l => l.lineId !== lineId);
  render();
}
function updateCartLineDate(lineId, value) {
  const line = posCart.find(l => l.lineId === lineId);
  if (line) line.mealDate = value;
  render();
}
function updateCartLineCategory(lineId, value) {
  const line = posCart.find(l => l.lineId === lineId);
  if (line) line.categoryId = value;
  render();
}

function checkoutOrder() {
  if (posCart.length === 0) return;
  if (posOrderType === "VILLA_SERVICE" && !posVillaStayId) {
    alert(t("pos.selectVilla"));
    return;
  }
  const items = posCart.map(l => {
    const p = state.products.find(pr => pr.id === l.productId);
    return { productId: p.id, qty: l.qty, price: p.price, mealDate: l.mealDate, categoryId: l.categoryId };
  });
  const paymentMethodEl = document.getElementById("pos_payment_method");
  const order = OrderService.create({
    type: posOrderType,
    villaStayId: posOrderType === "VILLA_SERVICE" ? posVillaStayId : null,
    tableNumber: posOrderType === "DINE_IN" ? posTableNumber : "",
    items,
    paymentMethod: paymentMethodEl ? paymentMethodEl.value : "CASH",
    mealDate: posOrderType === "VILLA_SERVICE" ? posMealDate : undefined,
  });
  posCart = [];
  if (posOrderType === "VILLA_SERVICE" && posVillaStayId) {
    delete posVillaCarts[posVillaStayId]; // order submitted — nothing left open for this villa
  }
  posVillaStayId = "";
  posTableNumber = "";
  posMealDate = todayISO();
  const label = order.tableNumber ? `${t("pos.table")} ${order.tableNumber} — #${order.number}` : "#" + order.number;
  alert(t("pos.orderCreated") + " " + label);
  printOrderInvoice(order);
  render();
}

function addPurchaseLine() {
  const tbody = document.getElementById("f_purchase_lines");
  if (!tbody) return;
  const i = purchaseLineCount++;
  tbody.insertAdjacentHTML("beforeend", purchaseLineRowHtml(i));
}

function removePurchaseLine(i) {
  const row = document.getElementById(`f_pline_row_${i}`);
  if (row) row.remove();
  recalcPurchaseGrandTotal();
}

function recalcPurchaseLine(i) {
  const qtyEl = document.getElementById(`f_pline_qty_${i}`);
  const costEl = document.getElementById(`f_pline_cost_${i}`);
  const totalEl = document.getElementById(`f_pline_total_${i}`);
  const qty = Number(qtyEl ? qtyEl.value : 0) || 0;
  const cost = Number(costEl ? costEl.value : 0) || 0;
  if (totalEl) totalEl.textContent = egp(qty * cost);
  recalcPurchaseGrandTotal();
}

function recalcPurchaseGrandTotal() {
  let total = 0;
  for (let i = 0; i < purchaseLineCount; i++) {
    const qtyEl = document.getElementById(`f_pline_qty_${i}`);
    const costEl = document.getElementById(`f_pline_cost_${i}`);
    if (!qtyEl || !costEl) continue; // row was removed
    total += (Number(qtyEl.value) || 0) * (Number(costEl.value) || 0);
  }
  const totalEl = document.getElementById("f_purchase_total");
  if (totalEl) totalEl.textContent = egp(total);
}

function submitAddPurchase() {
  const supplier = document.getElementById("f_purchase_supplier").value.trim();
  const invoiceNumber = document.getElementById("f_purchase_invoice").value.trim();
  const dateVal = document.getElementById("f_purchase_date").value;
  const date = dateVal ? new Date(dateVal + "T12:00:00").toISOString() : new Date().toISOString();

  const lines = [];
  for (let i = 0; i < purchaseLineCount; i++) {
    const itemEl = document.getElementById(`f_pline_item_${i}`);
    const qtyEl = document.getElementById(`f_pline_qty_${i}`);
    const costEl = document.getElementById(`f_pline_cost_${i}`);
    if (!itemEl || !qtyEl) continue; // row was removed
    const qty = Number(qtyEl.value);
    if (!qty || qty <= 0) continue;
    lines.push({ itemId: itemEl.value, qty, unitCost: costEl ? Number(costEl.value) || 0 : 0 });
  }

/* ---------------- Reports: state ---------------- */

let reportsTab = null; // null = card grid landing; otherwise a REPORTS_TABS key
let reportsCustomFrom = (() => { const d = new Date(); d.setDate(d.getDate() - 29); return d.toISOString().slice(0, 10); })();
let reportsCustomTo = new Date().toISOString().slice(0, 10);
let reportsSearch = "";
let reportsActiveTitle = "";
let reportsActiveHeaders = [];
let reportsActiveRows = [];

/* ---------------- Reports: date-range + calculation helpers ---------------- */

function getReportsBounds() {
  const from = reportsCustomFrom ? new Date(reportsCustomFrom + "T00:00:00") : null;
  const to = reportsCustomTo ? new Date(reportsCustomTo + "T23:59:59") : new Date();
  return { from, to };
}

function getReportsPreviousBounds(from, to) {
  if (!from) return { from: null, to: null };
  const lengthMs = to.getTime() - from.getTime();
  const prevTo = new Date(from.getTime() - 1);
  const prevFrom = new Date(prevTo.getTime() - lengthMs);
  return { from: prevFrom, to: prevTo };
}

function inRange(dateVal, from, to) {
  const d = new Date(dateVal);
  return (!from || d >= from) && (!to || d <= to);
}

function reportsRevenueFor(from, to) {
  const orders = state.orders.filter(o => inRange(o.createdAt, from, to));
  const tours = state.tourBookings.filter(b => b.status !== "CANCELLED" && b.paymentMethod && inRange(b.date, from, to));
  const ordersRevenue = orders.reduce((s, o) => s + o.total, 0);
  const toursRevenue = tours.reduce((s, b) => s + b.price, 0);
  return { orders, tours, revenue: ordersRevenue + toursRevenue };
}

function reportsExpensesFor(from, to) {
  return state.expenses.filter(e => inRange(e.createdAt, from, to));
}

function computeOccupancyRate(from, to) {
  if (state.villas.length === 0) return null;
  const rangeStart = from || (state.villaStays.length
    ? new Date(Math.min(...state.villaStays.map(s => new Date(s.checkIn).getTime())))
    : to);
  const rangeDays = Math.max(1, Math.ceil((to - rangeStart) / 86400000) + 1);
  let occupiedDays = 0;
  for (const s of state.villaStays) {
    const ci = new Date(s.checkIn);
    const co = s.checkOut ? new Date(s.checkOut) : to;
    const start = ci > rangeStart ? ci : rangeStart;
    const end = co < to ? co : to;
    if (end > start) occupiedDays += (end - start) / 86400000;
  }
  const capacity = state.villas.length * rangeDays;
  return capacity > 0 ? Math.min(100, (occupiedDays / capacity) * 100) : 0;
}

function deltaPct(curr, prev) {
  if (prev === 0) return curr > 0 ? 100 : 0;
  return ((curr - prev) / prev) * 100;
}

/* ---------------- Reports: filter bar actions ---------------- */

function computeQuickRangeDates(key) {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const iso = (d) => d.toISOString().slice(0, 10);
  switch (key) {
    case "today": return { from: iso(startOfToday), to: iso(now) };
    case "week": return { from: iso(new Date(startOfToday.getTime() - 6 * 86400000)), to: iso(now) };
    case "month": return { from: iso(new Date(startOfToday.getTime() - 29 * 86400000)), to: iso(now) };
    case "year": return { from: iso(new Date(startOfToday.getTime() - 364 * 86400000)), to: iso(now) };
    default: return { from: "", to: "" }; // "all"
  }
}

function setReportsQuickRange(key) {
  const { from, to } = computeQuickRangeDates(key);
  reportsCustomFrom = from;
  reportsCustomTo = to;
  render();
}

function applyReportsFilters() {
  const fromEl = document.getElementById("reports_date_from");
  const toEl = document.getElementById("reports_date_to");
  const searchEl = document.getElementById("reports_search");
  if (fromEl) reportsCustomFrom = fromEl.value;

}

function escAttr(v) {
